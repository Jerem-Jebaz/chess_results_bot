name: Chess Results Bot

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OS packages for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxrandr2 libxdamage1 libx11-xcb1 \
            libxkbcommon0 libgbm1 libasound2 libpangocairo-1.0-0 libgtk-3-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run one-shot checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOURNAMENT_ID: ${{ secrets.TOURNAMENT_ID }}
          PLAYER_NAME: ${{ secrets.PLAYER_NAME }}
          POLL_INTERVAL_SECONDS: '90'
          STATE_PATH: 'state/state.json'
          BROWSER_HEADLESS: 'true'
        run: |
          # provide sane defaults if secrets aren't set
          export TOURNAMENT_ID="${TOURNAMENT_ID:-1413687}"
          export PLAYER_NAME="${PLAYER_NAME:-Joel Chelsan Jebaz}"
          python -m bot.one_shot
